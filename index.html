<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
</head>
<body class="bg-sky-100 min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">

    <h1 class="text-2xl font-bold text-center text-sky-800">Weather App</h1>
    <p id="current-date" class="text-center text-gray-500 mt-1"></p>

    <form id="search-form" class="flex gap-2 mt-6">
      <input id="city-input" type="text" placeholder="Enter a city name"
        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400">
      <button type="submit"
        class="bg-sky-600 hover:bg-sky-700 text-white font-semibold px-4 py-2 rounded-lg">
        Search
      </button>
    </form>

    <p id="error-message" class="text-red-600 text-center mt-4 hidden"></p>

    <section id="weather-card" class="hidden mt-6 text-center">
      <p id="weather-icon" class="text-6xl"></p>
      <h2 id="city-name" class="text-xl font-semibold mt-2"></h2>
      <p id="temperature" class="text-4xl font-bold mt-1"></p>
      <p id="condition" class="text-gray-600 mt-1"></p>

      <div class="grid grid-cols-2 gap-4 mt-6">
        <div class="bg-sky-50 rounded-lg p-3">
          <p class="text-sm text-gray-500">Humidity</p>
          <p id="humidity" class="font-semibold"></p>
        </div>
        <div class="bg-sky-50 rounded-lg p-3">
          <p class="text-sm text-gray-500">Wind Speed</p>
          <p id="wind" class="font-semibold"></p>
        </div>
      </div>
    </section>

    <section class="mt-8">
      <h3 class="font-semibold text-gray-700">Recent Searches</h3>
      <div id="recent-searches" class="flex flex-wrap gap-2 mt-2"></div>
    </section>

  </main>

</body>
</html>
